<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unterrichtsplanung</title>
  <style>
    :root { --line:#555d62; --edit:#f5f6f6; --head:#e5e8e9; --blue:#396985; --ink:#1e2529; --canvas:#eef0f1; --soft-blue:#edf4f7; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--ink); font-family:Arial, "Liberation Sans", sans-serif; font-size:10.5pt; line-height:1.28; }
    .toolbar { position:sticky; top:0; z-index:20; display:flex; flex-wrap:nowrap; gap:5px; align-items:center; overflow-x:auto; padding:7px max(12px, calc((100% - 1120px)/2)); background:#fff; border-bottom:1px solid #cbd1d4; box-shadow:0 1px 4px #00000012; white-space:nowrap; }
    button, .file-button { appearance:none; flex:0 0 auto; border:1px solid #aeb8bd; border-radius:3px; background:#fff; color:#263238; padding:4px 7px; font:inherit; font-size:8.5pt; font-weight:400; line-height:1.25; cursor:pointer; box-shadow:none; }
    button:hover, .file-button:hover { border-color:var(--blue); color:#164b6d; background:var(--soft-blue); }
    .primary { background:#386984; border-color:#386984; color:#fff; }
    .primary:hover { background:#2c5971; color:#fff; }
    .file-button input { display:none; }
    .status { flex:0 0 auto; min-height:1em; margin-left:auto; color:#526068; font-size:8.25pt; }
    .document { width:calc(100% - 24px); max-width:1120px; min-height:297mm; margin:14px auto 28px; padding:12mm 10mm; background:#fff; border:1px solid #d4d9db; border-radius:2px; box-shadow:0 2px 8px #00000010; }
    .title-line { display:flex; align-items:center; gap:8px; margin:0 0 6px; font-weight:700; color:#20282d; }
    .title-line label { white-space:nowrap; }
    .title-line .print-field { flex:1 1 auto; }
    .learning-goals { display:flex; align-items:center; gap:8px; margin:0 0 10px; font-weight:700; }
    .learning-goals > span { flex:1 1 auto; }
    .plan-table { width:100%; border-collapse:collapse; table-layout:fixed; }
    .plan-table col:nth-child(1) { width:21%; }
    .plan-table col:nth-child(2) { width:38%; }
    .plan-table col:nth-child(3) { width:21%; }
    .plan-table col:nth-child(4) { width:20%; }
    th, td { border:0.5pt solid var(--line); padding:3.5px 4px; overflow-wrap:anywhere; vertical-align:top; }
    th { height:36px; background:var(--head); vertical-align:middle; text-align:center; color:#1f292e; font-family:"Times New Roman", Liberation Serif, serif; font-weight:400; }
    td { min-width:0; }
    .phase-row td { background:#fff; }
    .phase-row td:nth-child(2) { background:#fbfbfb; }
    input:not([type="checkbox"]):not([type="file"]), textarea { display:block; width:100%; min-width:0; margin:0; border:1px solid #c8d0d3; border-radius:2px; padding:3px 4px; background:var(--edit); color:#172026; font:inherit; line-height:1.25; box-shadow:none; }
    input:hover, textarea:hover { border-color:#aab8be; }
    input:focus, textarea:focus { outline:2px solid #b9d3e0; outline-offset:-1px; border-color:#6b9bb5; background:#fff; }
    input[type="number"] { flex:0 0 52px; width:52px !important; text-align:center; }
    textarea { min-height:3.2em; resize:vertical; overflow:hidden; white-space:pre-wrap; }
    .phase-name { font-weight:700; margin-bottom:4px !important; }
    .field-label { display:block; margin:5px 0 2px; color:#536067; font-size:8.25pt; font-weight:400; }
    .duration-row { display:flex; align-items:center; gap:4px; margin-top:7px; font-size:9pt; white-space:nowrap; }
    .method { margin-top:4px !important; }
    .combo { min-height:1.8em; }
    .combo-wrap { position:relative; display:flex; width:100%; min-width:0; }
    .combo-wrap input { flex:1 1 auto; width:auto; padding-right:2px; border-radius:2px 0 0 2px; }
    .combo-toggle { flex:0 0 22px; width:22px; min-width:22px; margin:0; padding:0; border-left:0; border-radius:0 2px 2px 0; background:#edf0f1; color:transparent; font-size:0; line-height:1; transform:none; }
    .combo-toggle::after { content:""; display:inline-block; width:5px; height:5px; border:solid #5b666c; border-width:0 1.5px 1.5px 0; transform:rotate(45deg) translateY(-2px); }
    .combo-toggle:hover, .combo-wrap:focus-within .combo-toggle { border-color:#6e9cbb; background:#e0edf3; color:transparent; transform:none; }
    .combo-toggle:hover::after, .combo-wrap:focus-within .combo-toggle::after { border-color:#285b79; }
    .combo-menu { position:absolute; z-index:10; top:calc(100% + 1px); left:0; right:0; max-height:185px; overflow-y:auto; border:1px solid #7695a9; border-radius:2px; background:#fff; box-shadow:0 3px 9px #0003; }
    .combo-menu[hidden] { display:none; }
    .combo-option { display:block; width:100%; border:0; border-bottom:1px solid #e1e4e6; border-radius:0; padding:5px 6px; background:#fff; color:#151515; text-align:left; font-size:9pt; white-space:normal; overflow-wrap:anywhere; }
    .combo-option:last-child { border-bottom:0; }
    .combo-option:hover, .combo-option:focus { background:#e9f2f8; color:#102f4b; outline:none; }
    .content-area { min-height:7.2em; }
    .compact-area { min-height:3.5em; }
    .phase-actions { display:flex; flex-wrap:wrap; gap:3px; margin-top:7px; }
    .phase-actions button { padding:2px 5px; font-size:8pt; font-weight:400; }
    .phase-actions button[data-action="up"], .phase-actions button[data-action="down"] { min-width:20px; padding-inline:3px; }
    .phase-actions .delete { color:#8d2525; }
    .print-value { display:none; white-space:pre-wrap; overflow-wrap:anywhere; min-height:1.2em; }
    .print-check { display:none; }
    .help { margin:8px 0 0; color:#5c6469; font-size:8.5pt; }
    .screen-only { display:block; }
    @media (max-width:700px) { .document { width:100%; margin:0; padding:7mm 4mm; box-shadow:none; } .toolbar { position:static; padding:8px; } .status { width:100%; margin-left:0; } body { font-size:9.5pt; } }
    @page { size:A4 portrait; margin:8mm 9mm 9mm; }
    @media print {
      html, body { width:auto; margin:0; background:#fff; font-size:9.2pt; line-height:1.22; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .toolbar, .screen-only, .phase-actions, .help { display:none !important; }
      .document { width:auto; max-width:none; min-height:0; margin:0; padding:0; border:0; border-radius:0; box-shadow:none; }
      .title-line { margin-bottom:4px; }
      .learning-goals { gap:3px 13px; margin-bottom:7px; }
      .plan-table { width:100%; }
      thead { display:table-header-group; }
      /* Kurze Phasen bleiben zusammen; überlange Tabellenzeilen darf der Browser bei Bedarf dennoch umbrechen. */
      tr { break-inside:avoid; page-break-inside:avoid; }
      th, td { border-color:#3e3e3e; padding:2.5px 3px; }
      th { height:auto; background:#e6e6e6 !important; }
      .phase-row td:nth-child(2) { background:#fafafa !important; }
      .combo-toggle, .combo-menu { display:none !important; }
      input:not([type="checkbox"]):not([type="file"]), textarea { display:none !important; }
      .print-value { display:block; }
      .print-field { min-width:0; }
      .phase-name + .print-value { font-weight:700; }
      .field-label { margin:4px 0 1px; font-size:8pt; }
      .duration-row { margin-top:5px; }
      .duration-row .print-value { display:inline; min-width:0; }
      .duration-row .print-value:empty::after { content:"–"; }
    }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="Werkzeugleiste">
    <button type="button" class="primary" id="addPhase">Neue Phase hinzufügen</button>
    <button type="button" id="save">Daten speichern</button>
    <button type="button" id="export">JSON exportieren</button>
    <label class="file-button">JSON importieren<input id="import" type="file" accept="application/json,.json"></label>
    <button type="button" id="reset">Formular zurücksetzen</button>
    <button type="button" id="print">Drucken / als PDF speichern</button>
    <span class="status" id="status" aria-live="polite"></span>
  </nav>

  <main class="document">
    <section class="header" aria-label="Kopfbereich">
      <div class="title-line"><label for="planningTitle">Stundenplanung:</label><span class="print-field"><input id="planningTitle" data-header="title" aria-label="Stundenplanung"><span class="print-value"></span></span></div>
      <div class="learning-goals"><strong>LZ:</strong><span class="print-field"><input id="learningGoals" aria-label="Lernzielbereiche"><span class="print-value"></span></span></div>
    </section>
    <table class="plan-table" aria-label="Unterrichtsplanung">
      <colgroup><col><col><col><col></colgroup>
      <thead><tr><th>Unterrichtsschritt /<br>Methodik</th><th>Sach- und Verhaltensaspekt</th><th>Sozialform /<br>Handlungsmuster</th><th>Medien</th></tr></thead>
      <tbody id="phases"></tbody>
    </table>
    <p class="help screen-only">Alle hellgrauen Felder sind direkt bearbeitbar. Bei Auswahlfeldern können Sie einen Vorschlag wählen oder einen eigenen Wert eingeben. Die Eingaben werden automatisch im Browser gespeichert.</p>
  </main>

  <!-- ODT-Abgleich: Alle nachstehenden Datalists wurden gegen Vorlage-U-Planung.odt kontrolliert: Anzahl, Schreibweise, Reihenfolge und Standardwerte. -->
  <datalist id="list-einstieg"><option value="Cluster"><option value="Rekapitulation/Wdh."><option value="stummer Impuls (Bild o.ä.)"><option value="spielerisch (Rätsel, Rollenspiel)"><option value="informierend (L-zentriert)"><option value="aktuell (Ereignisbezug)"><option value="literarisch (Auszug lesen)"><option value="Schülerreferat"><option value="Assoziativ (Meinungsbild, Blitzlich)"></datalist>
  <datalist id="list-erarbeitung1"><option value="Bearbeiten des ABs"><option value="Bearbeiten der Aufg."><option value="Präsentation"><option value="Gruppen-Puzzle"><option value="Fishbowl/Kugellager"><option value="Partnerkorrektur"><option value="Schreibkonferenz"><option value="Textlupe"><option value="Streitgespräch"><option value="Szenisches Spiel/szenische Interpretation"><option value="Placemat"><option value="Mind-Map"><option value="Gallery-Walk"><option value="4-Corners"><option value="Teamteaching"><option value="Lerntempoduett"><option value="Diskussion/Panel-Discussion"><option value="Szenische Interpretation"></datalist>
  <datalist id="list-erarbeitung2"><option value="Bearbeiten des ABs"><option value="Bearbeiten der Aufg."><option value="Metareflexion"><option value="Präsentation"><option value="Gruppen-Puzzle"><option value="Fishbowl/Kugellager"><option value="Partnerkorrektur"><option value="Schreibkonferenz"><option value="Textlupe"><option value="Streitgespräch"><option value="Szenisches Spiel/szenische Interpretation"><option value="Placemat"><option value="Gallery-Walk"><option value="Teamteaching"><option value="Lerntempoduett"><option value="Diskussion/Panel-Discussion"></datalist>
  <datalist id="list-sicherung"><option value="Zusammenfassung, Wdh., Vertiefung (Tafel/Heft)"><option value="Gewichtung, Beurteilung, Kritik/Lob der Ergebnisse"><option value="Teilergebnisse aus EA/PA/GA zusammenführen (Tafel/Heft)"><option value="Korrektur: fehlerhafte oder missverständliche Ergebnisse korrigieren"><option value="Veröffentlichung: Wandzeitung, Poster, szenische Darstellung"><option value="Metareflexion"></datalist>
  <datalist id="list-transfer"><option value="Video"><option value="Zitat"><option value="Textstelle"><option value="Gegenargument"></datalist>
  <datalist id="list-unterrichtsschritt"><option value="Erarbeitung I"><option value="Erarbeitung II"><option value="Zwischensicherung"><option value="Plateaubildung"><option value="Freiarbeit"><option value="Stationenlernen"><option value="Instruktion"></datalist>
  <datalist id="list-sozialform"><option value="Wählen Sie ein Element aus."><option value="guG"><option value="EA"><option value="PA"><option value="GA"><option value="Sbeitr."><option value="(1)EA+(2)PA"><option value="(1)PA+(2)GA"><option value="(1)GA+(2)PA"><option value="(1)GA+(2)EA"></datalist>
  <datalist id="list-mikro"><option value="PA - Paraphrasieren"><option value="PA - Korrigieren"><option value="PA - Weiterführen (Notizen wechselseitig erweitern)"><option value="PA - Ergänzen (einer trägt vor Partner ergänzt)"><option value="PA - Verbalisieren"><option value="PA - Interview (abfragen)"><option value="GA - Vorstellen + ergänzen"><option value="GA - Sharearound (Notizen im Uhrzeigersinn)"><option value="GA - freie Diskussion"><option value="GA - Interview (abfragen)"></datalist>
  <datalist id="list-medien"><option value="Wählen Sie ein Element aus."><option value="OHP"><option value="Elmo"><option value="Smartboard"><option value="TV"><option value="DVD/CD-Player"><option value="Buch"><option value="Heft"><option value="Zeitschrift/Magazin"><option value="Tafel"><option value="Quelle"><option value="Dramentext/Lyrik/Roman"><option value="Arbeitsblatt"></datalist>
  <datalist id="list-differenzierung"><option value="methodische Diff."><option value="didaktisch Diff."><option value="sozial Diff."><option value="inhaltlich Diff."><option value="organisatorisch Diff."></datalist>

  <script>
  (() => {
    'use strict';
    const STORAGE_KEY = 'unterrichtsplanung-v1';
    const $ = (selector, root = document) => root.querySelector(selector);
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    const uid = () => `phase-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const templateAspectTexts = new Set([
      'L. zeigt ein Bild von einem Außerirdischen.',
      'Frage: Wie können wir herausfinden, ob es Außerirdische gibt?\n\nErwartungshaltung: Wir können mit Hilfe eines Zeitungsartikel oder einem Sachtext herausfinden, ob es Außerirdische gibt.',
      'L ...'
    ]);
    const blankPhase = () => ({ id:uid(), name:'', nameList:'list-unterrichtsschritt', method:'', methodList:'', minutes:'', aspect:'', social:'', micro:'', media:'', differentiation:'' });
    const defaults = () => ({
      version:1, title:'5E - Deutsch - Informationsquellen nutzen',
      learningGoals:'',
      phases:[
        {id:uid(), name:'Einstieg', nameList:'', method:'stummer Impuls (Bild o.ä.)', methodList:'list-einstieg', minutes:'5', aspect:'', social:'guG', micro:'', media:'Smartboard', differentiation:''},
        {id:uid(), name:'Entwicklung der erkenntnisleitenden Frage', nameList:'', method:'', methodList:'', minutes:'3', aspect:'', social:'guG', micro:'', media:'Smartboard', differentiation:''},
        {id:uid(), name:'Erarbeitung I', nameList:'list-unterrichtsschritt', method:'Lerntempoduett', methodList:'list-erarbeitung1', minutes:'30', aspect:'', social:'(1)EA+(2)PA', micro:'PA/GA-Mikro', media:'Arbeitsblatt', differentiation:'inhaltlich Diff.'},
        {id:uid(), name:'Sicherung', nameList:'list-unterrichtsschritt', method:'Wählen Sie ein Element aus', methodList:'list-erarbeitung2', minutes:'7', aspect:'', social:'Sozialform', micro:'PA - Weiterführen (Notizen wechselseitig erweitern)', media:'Elmo', differentiation:'sozial Diff.'},
        {id:uid(), name:'', nameList:'list-unterrichtsschritt', method:'Wählen Sie ein Element aus.', methodList:'list-sicherung', minutes:'', aspect:'', social:'EA', micro:'', media:'Wählen Sie ein Element aus.', differentiation:''},
        {id:uid(), name:'Transfer', nameList:'', method:'Wählen Sie ein Element aus.', methodList:'list-transfer', minutes:'', aspect:'', social:'Sozialform', micro:'', media:'Medien', differentiation:''}
      ]
    });
    let data = load() || defaults();
    function load() { try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (!valid(saved)) return null; saved.phases = saved.phases.map(phase => templateAspectTexts.has(String(phase.aspect || '').trim()) ? {...phase, aspect:''} : phase); return saved; } catch { return null; } }
    function valid(value) { return value && typeof value === 'object' && Array.isArray(value.phases); }
    function save(showMessage = false) { data = collect(); try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); if (showMessage) status('Gespeichert.'); } catch { status('Speichern im Browser ist nicht verfügbar.'); } }
    function status(message) { const el = $('#status'); el.textContent = message; window.clearTimeout(status.timer); status.timer = window.setTimeout(() => el.textContent = '', 2600); }
    function collect() {
      const next = {version:1, title:$('#planningTitle').value, learningGoals:$('#learningGoals').value, phases:[]};
      document.querySelectorAll('.phase-row').forEach(row => {
        const previous = data.phases.find(item => item.id === row.dataset.id) || blankPhase();
        const phase = {...previous, id:row.dataset.id};
        row.querySelectorAll('[data-field]').forEach(el => phase[el.dataset.field] = el.value);
        next.phases.push(phase);
      });
      return next;
    }
    function field(phase, key, className = '', list = '') {
      const input = `<input class="${className}" data-field="${key}" ${list ? `list="${escapeHtml(list)}"` : ''} value="${escapeHtml(phase[key])}" aria-label="${escapeHtml(key)}">`;
      const editableCombo = list ? `<span class="combo-wrap">${input}<button type="button" class="combo-toggle screen-only" data-combo-toggle aria-label="Vorschläge für ${escapeHtml(key)} anzeigen" aria-expanded="false">▾</button><span class="combo-menu screen-only" hidden></span></span>` : input;
      return `<span class="print-field">${editableCombo}<span class="print-value"></span></span>`;
    }
    function textarea(phase, key, className = '') { return `<span class="print-field"><textarea class="${className}" data-field="${key}" aria-label="${escapeHtml(key)}">${escapeHtml(phase[key])}</textarea><span class="print-value"></span></span>`; }
    function render() {
      $('#planningTitle').value = data.title || '';
      $('#learningGoals').value = data.learningGoals || '';
      $('#phases').innerHTML = data.phases.map(phase => `<tr class="phase-row" data-id="${escapeHtml(phase.id)}">
        <td>
          ${field(phase, 'name', 'phase-name combo', phase.nameList)}
          <label class="field-label">Methode / Impuls</label>${field(phase, 'method', 'method combo', phase.methodList)}
          <div class="duration-row"><span>T</span><span class="print-field"><input type="number" min="0" step="1" data-field="minutes" value="${escapeHtml(phase.minutes)}" aria-label="Dauer in Minuten"><span class="print-value"></span></span><span>Minuten</span></div>
          <div class="phase-actions screen-only"><button type="button" data-action="up" title="Phase nach oben">↑</button><button type="button" data-action="down" title="Phase nach unten">↓</button><button type="button" data-action="duplicate">Duplizieren</button><button type="button" data-action="delete" class="delete">Löschen</button></div>
        </td>
        <td>${textarea(phase, 'aspect', 'content-area')}</td>
        <td>
          <label class="field-label">Sozialform</label>${field(phase, 'social', 'combo', 'list-sozialform')}
          <label class="field-label">PA/GA-Mikro</label>${field(phase, 'micro', 'combo', 'list-mikro')}
        </td>
        <td>
          <label class="field-label">Medien</label>${field(phase, 'media', 'combo', 'list-medien')}
          <label class="field-label">Differenzierung</label>${field(phase, 'differentiation', 'combo', 'list-differenzierung')}
        </td>
      </tr>`).join('');
      resizeAll(); syncPrintValues();
    }
    function autoResize(textarea) { textarea.style.height = 'auto'; textarea.style.height = `${textarea.scrollHeight}px`; }
    function resizeAll() { document.querySelectorAll('textarea').forEach(autoResize); }
    function syncPrintValues() { document.querySelectorAll('.print-field').forEach(wrapper => { const control = wrapper.querySelector('input, textarea'); const out = wrapper.querySelector('.print-value'); if (control && out) out.textContent = control.value; }); }
    function closeCombos(except = null) { document.querySelectorAll('.combo-wrap').forEach(wrap => { if (wrap !== except) { const menu = $('.combo-menu', wrap); const toggle = $('[data-combo-toggle]', wrap); if (menu) menu.hidden = true; if (toggle) toggle.setAttribute('aria-expanded', 'false'); } }); }
    function fillComboMenu(wrap, query = null) {
      const input = $('input[list]', wrap); const menu = $('.combo-menu', wrap); if (!input || !menu || !input.list) return;
      const search = (query === null ? input.value : query).trim().toLocaleLowerCase('de');
      const options = Array.from(input.list.options).map(option => option.value).filter(value => !search || value.toLocaleLowerCase('de').includes(search));
      menu.innerHTML = options.length ? options.map(value => `<button type="button" class="combo-option">${escapeHtml(value)}</button>`).join('') : '<span class="combo-option">Keine passende Vorgabe – eigener Text bleibt möglich.</span>';
    }
    function openCombo(wrap) { closeCombos(wrap); fillComboMenu(wrap, ''); $('.combo-menu', wrap).hidden = false; $('[data-combo-toggle]', wrap).setAttribute('aria-expanded', 'true'); }
    function onInput(event) {
      if (event.target.matches('textarea')) autoResize(event.target);
      const wrap = event.target.closest('.combo-wrap'); if (wrap && !$('.combo-menu', wrap).hidden) fillComboMenu(wrap);
      syncPrintValues(); save(false);
    }
    document.addEventListener('input', onInput);
    document.addEventListener('change', event => { if (event.target.matches('[data-goal], input, textarea')) { syncPrintValues(); save(false); } });
    document.addEventListener('click', event => {
      const toggle = event.target.closest('[data-combo-toggle]');
      if (toggle) { const wrap = toggle.closest('.combo-wrap'); const menu = $('.combo-menu', wrap); if (menu.hidden) openCombo(wrap); else closeCombos(); return; }
      const option = event.target.closest('.combo-option');
      if (option && option.tagName === 'BUTTON') { const wrap = option.closest('.combo-wrap'); const input = $('input[list]', wrap); input.value = option.textContent; input.dispatchEvent(new Event('input', {bubbles:true})); input.focus(); closeCombos(); return; }
      if (!event.target.closest('.combo-wrap')) closeCombos();
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeCombos(); });
    $('#phases').addEventListener('click', event => {
      const button = event.target.closest('[data-action]'); if (!button) return;
      data = collect(); const row = button.closest('.phase-row'); const index = data.phases.findIndex(phase => phase.id === row.dataset.id); const action = button.dataset.action;
      if (action === 'delete') { if (data.phases.length === 1 || confirm('Diese Unterrichtsphase löschen?')) data.phases.splice(index, 1); }
      if (action === 'duplicate') { const copy = JSON.parse(JSON.stringify(data.phases[index])); copy.id = uid(); data.phases.splice(index + 1, 0, copy); }
      if (action === 'up' && index > 0) [data.phases[index - 1], data.phases[index]] = [data.phases[index], data.phases[index - 1]];
      if (action === 'down' && index < data.phases.length - 1) [data.phases[index + 1], data.phases[index]] = [data.phases[index], data.phases[index + 1]];
      save(false); render();
    });
    $('#addPhase').addEventListener('click', () => { data = collect(); data.phases.push(blankPhase()); save(false); render(); const last = $('#phases tr:last-child [data-field="name"]'); if (last) last.focus(); });
    $('#save').addEventListener('click', () => save(true));
    $('#print').addEventListener('click', () => { syncPrintValues(); save(false); window.print(); });
    $('#reset').addEventListener('click', () => { if (!confirm('Alle Eingaben auf die Vorlage zurücksetzen?')) return; data = defaults(); try { localStorage.removeItem(STORAGE_KEY); } catch {} render(); save(false); status('Formular wurde zurückgesetzt.'); });
    $('#export').addEventListener('click', () => { save(false); const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'unterrichtsplanung-daten.json'; link.click(); URL.revokeObjectURL(link.href); status('JSON-Datei wurde exportiert.'); });
    $('#import').addEventListener('change', event => { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => { try { const imported = JSON.parse(reader.result); if (!valid(imported)) throw new Error(); imported.version = 1; imported.phases = imported.phases.map(phase => ({...blankPhase(), ...phase, id:phase.id || uid()})); data = imported; save(false); render(); status('JSON-Daten wurden importiert.'); } catch { alert('Die gewählte Datei enthält keine gültigen Unterrichtsplanungs-Daten.'); } finally { event.target.value = ''; } }; reader.readAsText(file, 'utf-8'); });
    window.addEventListener('beforeprint', () => { resizeAll(); syncPrintValues(); });
    render();
  })();
  </script>
</body>
</html>
